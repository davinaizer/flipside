# Runs on every pull request into main, where features land.
# A pull_request run checks out the merge of the PR into its base branch, so a green run
# means the result of merging passes, not only the branch on its own.
# Docs-only PRs (only docs/** and *.md changed) skip the heavy jobs. The workflow itself must
# always run: with a workflow-level paths-ignore the required checks never report and the PR
# waits forever. A job skipped by `if` still reports under its own name and counts as passing.
name: checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes (does the PR touch more than docs?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # The checkout is the merge commit; its first parent is the base branch tip.
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify (typecheck, lint, unit and integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests start a throwaway Postgres 17 with Podman (tests/global-setup.ts); the runner has Podman.
      - run: bash scripts/verify.sh

  e2e:
    name: e2e (Playwright with axe, desktop and iPad)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright boots its own Postgres (Podman) and a production build of the app.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
