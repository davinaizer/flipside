<script>
  (function() {
    const retryBtn = document.getElementById('retryButton');
    const retryIcon = document.getElementById('retryIcon');
    const retryLabel = document.getElementById('retryLabel');
    const copyBtn = document.getElementById('copyDiagnosticBtn');

    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        retryBtn.disabled = true;
        retryIcon.classList.add('animate-spin');
        retryLabel.textContent = 'Connecting...';
        
        setTimeout(function() {
          retryIcon.classList.remove('animate-spin');
          retryLabel.textContent = 'Retry connection';
          retryBtn.disabled = false;
        }, 1800);
      });
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', function() {
        navigator.clipboard?.writeText('Status: Connection refused • Host: home-server.local:5432 • Database: PostgreSQL 17');
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span class="material-symbols-outlined text-[15px] text-secondary">check</span><span>Copied</span>';
        setTimeout(function() {
          copyBtn.innerHTML = originalText;
        }, 1600);
      });
    }
  })();
