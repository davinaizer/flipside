<div aria-hidden="true" class="pointer-events-none absolute bottom-4 -right-16 w-96 h-96 rounded-full bg-secondary-fixed/30 blur-3xl"></div>

<div class="w-7 h-7 rounded-lg bg-primary text-on-primary flex items-center justify-center shadow-sm">

</div>

<span class="text-label-sm font-label-sm uppercase tracking-wider text-outline px-1.5 py-0.5 rounded bg-surface-container text-on-surface-variant">Local</span>
</div>
<!-- Page Intent -->
<h1 class="font-display text-display text-on-surface tracking-tight mb-2">
        Who is revising today?
      </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">

      </p>

</div>
</footer>
</div>
<script>
    function selectProfile(profileName) {
      // Visual feedback with natural gentle transition
      const activeCard = event.currentTarget;
      activeCard.classList.add('scale-95', 'opacity-90');
      
      setTimeout(() => {
        // Store session profile in local storage
        try {
          localStorage.setItem('flipside_active_user', profileName);
          localStorage.setItem('flipside_last_accessed', new Date().toISOString());
        } catch(e) {}
        
        // Dispatch custom app event or notification
        const banner = document.createElement('div');
        banner.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-inverse-surface text-inverse-on-surface font-label-md text-label-md shadow-xl z-50 flex items-center gap-2 animate-bounce';
        banner.innerHTML = `<span class="material-symbols-outlined text-sm text-tertiary-fixed">check_circle</span> Welcome back, ${profileName}. Loading revision desk...`;
        document.body.appendChild(banner);

        setTimeout(() => {
          banner.remove();
          activeCard.classList.remove('scale-95', 'opacity-90');
        }, 1200);
      }, 150);
    }

    function openProfileSettings() {
      alert("Reading settings & accessible typography preferences are configured independently for each profile.");
    }
  </script>
