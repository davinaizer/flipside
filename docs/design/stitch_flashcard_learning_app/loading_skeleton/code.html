          btnWeek.className = 'px-5 py-1.5 rounded-full font-display font-semibold text-xs bg-white text-slate-900 shadow-sm transition-all duration-200';
          btnMonth.className = 'px-5 py-1.5 rounded-full font-display font-medium text-xs text-slate-600 hover:text-slate-900 transition-all duration-200';
        });

        btnMonth.addEventListener('click', () => {
          btnMonth.className = 'px-5 py-1.5 rounded-full font-display font-semibold text-xs bg-white text-slate-900 shadow-sm transition-all duration-200';
